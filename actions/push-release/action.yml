name: Push release
description: >
  After a successful publish: pushes the version commit (if any) to the branch,
  tags the release and creates its GitHub Release with notes generated from the
  commits since the previous release of the same package. Safe to re-run: an
  existing tag or release is left alone. Needs `contents: write`.
inputs:
  tag:
    description: Tag to create
    required: true
  push-commit:
    description: '"false" where the branch is protected (the version then lives in the tags only)'
    default: "true"
  release:
    description: '"false" when another tool creates the GitHub Release (e.g. GoReleaser)'
    default: "true"
  latest:
    description: >
      '"false" to keep this release from being marked Latest, e.g. a package in
      a monorepo whose Latest release belongs to the main product'
    default: "true"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TAG: ${{ inputs.tag }}
        PUSH_COMMIT: ${{ inputs.push-commit }}
        BRANCH: ${{ github.ref_name }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if [ "$PUSH_COMMIT" = "true" ] && [ -n "$(git log "origin/$BRANCH..HEAD" --oneline)" ]; then
          # Another commit may have landed while publishing
          git pull -q --rebase origin "$BRANCH"
          git push -q origin "HEAD:$BRANCH"
          echo "Pushed the version commit to $BRANCH"
        fi
        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
          echo "Tag $TAG already exists"
        else
          git tag -a "$TAG" -m "$TAG"
          git push -q origin "$TAG"
          echo "Tagged $TAG"
        fi

    - if: inputs.release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        LATEST: ${{ inputs.latest }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists"
          exit 0
        fi
        # Notes start at the previous tag of the same package: "node-v1.9.1"
        # follows "node-v1.9.0", never another package's tag in a monorepo.
        PREFIX=$(printf '%s' "$TAG" | sed -E 's/v?[0-9]+\.[0-9]+\.[0-9]+$//')
        PREVIOUS=$(git ls-remote --tags --refs origin \
          | sed 's#.*refs/tags/##' \
          | grep -E "^${PREFIX}v?[0-9]+\.[0-9]+\.[0-9]+$" \
          | sort -V \
          | grep -B1 -x -F "$TAG" \
          | sed '$d' || true)
        ARGS=(--title "$TAG" --verify-tag --generate-notes --latest="$LATEST")
        if [ -n "$PREVIOUS" ]; then ARGS+=(--notes-start-tag "$PREVIOUS"); fi
        gh release create "$TAG" "${ARGS[@]}"
        echo "Released $TAG"
